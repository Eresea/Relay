<div class="field">
  <rl-icon name="search" [size]="16" />
  <input
    #field
    type="text"
    autocomplete="off"
    spellcheck="false"
    placeholder="Type a command"
    aria-label="Search commands"
    role="combobox"
    aria-expanded="true"
    aria-controls="palette-results"
    [attr.aria-activedescendant]="active() ? 'cmd-' + active()!.id : null"
    (input)="onQuery($any($event.target).value)"
  />
</div>

<div class="results" id="palette-results" role="listbox" aria-label="Commands">
  @for (section of sections(); track section.group) {
    <div class="group">
      <div class="u-caption heading" aria-hidden="true">{{ section.group }}</div>
      @for (match of section.matches; track match.command.id) {
        @let command = match.command;
        @let index = indexOf(match);
        <button
          type="button"
          class="row"
          role="option"
          [id]="'cmd-' + command.id"
          [class.is-active]="index === activeIndex()"
          [attr.aria-selected]="index === activeIndex()"
          (click)="run(command)"
          (mousemove)="activeIndex.set(index)"
        >
          @if (hue(command); as tone) {
            <span class="u-entity-tile tile" [style.--entity-hue]="tone">
              <rl-icon [name]="command.icon ?? 'circle'" [size]="14" />
            </span>
          } @else if (command.icon) {
            <rl-icon class="glyph" [name]="command.icon" [size]="16" />
          }

          <span class="label">{{ command.title }}</span>

          @if (command.hint) {
            <span class="hint">{{ command.hint }}</span>
          }

          @if (command.shortcut) {
            <rl-kbd [keys]="command.shortcut" />
          }
        </button>
      }
    </div>
  } @empty {
    <div class="empty">
      <p class="title">No matching command</p>
      <p class="body">Try a shorter word, or press Escape to close.</p>
    </div>
  }
</div>
