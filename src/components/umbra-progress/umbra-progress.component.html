@if (variant() === "linear") {
  <span class="track" aria-hidden="true">
    <span
      class="indicator"
      [class.indeterminate]="isIndeterminate()"
      [style.width.%]="isIndeterminate() ? 40 : percent()"
    ></span>
  </span>
} @else {
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle class="circle-track" cx="12" cy="12" r="9" pathLength="100" />
    <circle
      class="circle-indicator"
      [class.indeterminate]="isIndeterminate()"
      cx="12"
      cy="12"
      r="9"
      pathLength="100"
      [attr.stroke-dashoffset]="100 - percent()"
    />
  </svg>
}
