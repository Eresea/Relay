name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild
        required: true
        type: string
      mobile_only:
        description: Skip desktop builds and rebuild Android only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Prepare public release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_repo: ${{ steps.config.outputs.release_repo }}
      release_repo_owner: ${{ steps.config.outputs.release_repo_owner }}
      release_repo_name: ${{ steps.config.outputs.release_repo_name }}
      release_tag: ${{ steps.config.outputs.release_tag }}
    steps:
      - id: config
        shell: bash
        env:
          RELEASE_OWNER: ${{ vars.RELAY_RELEASE_OWNER || 'Eresea' }}
          RELEASE_NAME: ${{ vars.RELAY_RELEASE_NAME || 'Relay' }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_TAG}"
          test -n "$tag"
          echo "release_repo=$RELEASE_OWNER/$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_repo_owner=$RELEASE_OWNER" >> "$GITHUB_OUTPUT"
          echo "release_repo_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELAY_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ steps.config.outputs.release_repo }}
          RELEASE_TAG: ${{ steps.config.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          release_id="$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG" --jq .id 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            prerelease=false
            [[ "$RELEASE_TAG" == *-* ]] && prerelease=true
            release_id="$(gh api --method POST "repos/$RELEASE_REPO/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish=main \
              -f name="Relay $RELEASE_TAG" \
              -f body="Relay $RELEASE_TAG" \
              -F prerelease="$prerelease" \
              --jq .id)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: release
    if: ${{ inputs.mobile_only != true }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: npm run version:check -- "${RELEASE_TAG#v}"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Validate updater configuration
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELAY_RELEASE_TOKEN }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.RELAY_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TOKEN"
          test -n "$SIGNING_KEY"
          test -n "$PUBLIC_KEY"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELAY_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELAY_UPDATER_PUBLIC_KEY: ${{ vars.RELAY_UPDATER_PUBLIC_KEY }}
          RELAY_UPDATE_ENDPOINT: ${{ vars.RELAY_UPDATE_ENDPOINT }}
        with:
          releaseId: ${{ needs.release.outputs.release_id }}
          tagName: ${{ needs.release.outputs.release_tag }}
          releaseName: Relay ${{ needs.release.outputs.release_tag }}
          owner: ${{ needs.release.outputs.release_repo_owner || 'Eresea' }}
          repo: ${{ needs.release.outputs.release_repo_name || 'Relay' }}
          projectPath: .
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  android:
    name: Build Android
    needs: release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - run: npm ci

      - name: Check version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: npm run version:check -- "${RELEASE_TAG#v}"

      - name: Initialize Android project
        run: npm run android:init

      - name: Validate Android signing configuration
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_BASE64"

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/relay-upload.jks
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PATH
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'src-tauri/gen/android/app/build.gradle.kts';
          let gradle = readFileSync(path, 'utf8');
          const signing = `    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: error("ANDROID_KEY_ALIAS is required")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: error("ANDROID_KEY_PASSWORD is required")
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: error("ANDROID_KEYSTORE_PATH is required"))
                      storePassword = System.getenv("ANDROID_KEY_PASSWORD") ?: error("ANDROID_KEY_PASSWORD is required")
                  }
              }

          `;
          gradle = gradle.replace('    buildTypes {', signing + '    buildTypes {');
          gradle = gradle.replace(
            '        getByName("release") {\n            isMinifyEnabled = true',
            '        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = true',
          );
          writeFileSync(path, gradle);
          NODE

      - name: Build signed Android artifacts
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/relay-upload.jks
        run: npm run android:build -- --aab --apk --ci

      - name: Upload Android artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELAY_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ needs.release.outputs.release_repo }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -print -quit)"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$aab"
          test -n "$apk"
          cp "$aab" "$RUNNER_TEMP/relay-${RELEASE_TAG}.aab"
          cp "$apk" "$RUNNER_TEMP/relay-${RELEASE_TAG}.apk"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/relay-${RELEASE_TAG}.aab" \
            "$RUNNER_TEMP/relay-${RELEASE_TAG}.apk" \
            --repo "$RELEASE_REPO" \
            --clobber
