<button
  class="umbra-button"
  [type]="type()"
  [disabled]="disabled() || isLoading()"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-loading]="isLoading() || null"
  [attr.data-icon-position]="iconPosition()"
  [attr.aria-busy]="isLoading() ? 'true' : null"
  [attr.aria-pressed]="pressed()"
  [attr.aria-label]="ariaLabelledBy() ? null : ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledBy()"
  [attr.aria-describedby]="ariaDescribedBy()"
  (click)="runAction()"
>
  <span class="icon-slot" aria-hidden="true">
    <ng-content select="[umbraButtonIcon]" />
  </span>

  <span class="labels">
    <span class="label" [attr.aria-hidden]="isLoading() && loadingLabel() ? 'true' : null"
      ><ng-content
    /></span>
    @if (loadingLabel()) {
      <span class="loading-label" [attr.aria-hidden]="isLoading() ? null : 'true'">{{
        loadingLabel()
      }}</span>
    }
  </span>
</button>

@if (size() === 'icon' && isLoading()) {
  <svg
    class="progress-ring"
    viewBox="0 0 36 36"
    [class.progress-ring--indeterminate]="progressValue() === null"
    [attr.role]="progressValue() === null ? null : 'progressbar'"
    [attr.aria-label]="progressValue() === null ? null : 'Progress'"
    [attr.aria-valuemin]="progressValue() === null ? null : 0"
    [attr.aria-valuemax]="progressValue() === null ? null : 100"
    [attr.aria-valuenow]="progressValue()"
    [attr.aria-hidden]="progressValue() === null ? 'true' : null"
  >
    <circle class="progress-ring__track" cx="18" cy="18" r="16" />
    <circle
      class="progress-ring__value"
      cx="18"
      cy="18"
      r="16"
      pathLength="100"
      [attr.stroke-dashoffset]="progressOffset()"
    />
  </svg>
}
