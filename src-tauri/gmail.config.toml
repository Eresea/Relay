# Google OAuth 2.0 "installed application" credentials for the Gmail
# connector — see docs/ARCHITECTURE.md's Gmail connector section.
#
# Committing these is intentional and safe for this OAuth client type.
# Google's own guidance for a "Desktop app" OAuth client does not treat
# `client_secret` as confidential — there is no way to keep it hidden in a
