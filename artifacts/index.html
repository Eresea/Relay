<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relay artifacts</title><style>body{font:16px system-ui;max-width:48rem;margin:3rem auto;padding:0 1rem;color:#e8e8ed;background:#18181f}input,button{font:inherit;padding:.6rem;margin:.3rem 0}input{max-width:100%}button{cursor:pointer}li{margin:1rem 0}a{color:#a9c6ff}small{color:#bbb}#drop{border:1px dashed #888;padding:1rem;margin:1rem 0}#error{color:#ffb0a8}</style></head><body><h1>Artifacts</h1><p>Save and share interactive HTML files.</p><form id="login"><label>Admin token <input id="token" type="password" autocomplete="off" required></label> <button>Unlock</button></form><section id="library" hidden><button id="lock">Lock</button><div id="drop"><label>Import HTML <input id="file" type="file" accept=".html,.htm,text/html"></label><p><small>Or drop an HTML file here.</small></p></div><label>Search <input id="search" type="search"></label><ul id="list"></ul></section><p id="error" role="alert"></p><script src="/library.js"></script></body></html>
